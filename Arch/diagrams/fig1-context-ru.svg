    <path d="M 0 0 L 12 6 L 0 12 z" fill="#0F766E"/>
  </marker>
  <marker id="dot" markerWidth="10" markerHeight="10" refX="5" refY="5">
    <circle cx="5" cy="5" r="4" fill="#475569"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Рисунок 1. Контекст MVP: один файл, один экран, без бэкенда</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">Браузер раз в секунду читает атомарный JSON-снимок; движок позиционирования и Magma остаются вне этого инкремента.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="60" y="140" width="330" height="270" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="84" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">Источник координат</text><text x="84" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Движок позиционирования / скрипт</text><text x="84" y="251" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">RSSI → расстояния → позиция</text><text x="84" y="282" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Пишет один JSON-снимок</text><text x="84" y="313" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">1 Гц в демо</text><text x="84" y="382" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="0.9">Вне границ MVP</text><path d="M 470 225 h 190 l 40 40 v 145 h -230 z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><path d="M 660 225 v 40 h 40" fill="none" stroke="#B45309" stroke-width="2"/><text x="488" y="268" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">fleet.snapshot.json</text><text x="488" y="306" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">schemaVersion: 1.0</text><text x="488" y="333" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">площадка + станции</text><text x="488" y="360" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">+ тележки</text><text x="488" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">tmp → rename</text><rect x="760" y="140" width="280" height="270" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="784" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">Статический сервер</text><text x="784" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Nginx (прод) / Vite (дев)</text><text x="784" y="249" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">GET / → сборка React</text><text x="784" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">GET /data/…json</text><text x="784" y="307" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Cache-Control: no-store</text><text x="784" y="336" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Тот же origin → без CORS</text><rect x="1080" y="140" width="460" height="590" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" opacity="1.0"/><text x="1104" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Браузер: React SPA</text><rect x="1104" y="205" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="234" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">useFleetSnapshot()</text><text x="1124" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">TanStack Query · опрос 1 Гц</text><line x1="1310" y1="277" x2="1310" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="300" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="329" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">JsonFileFleetRepository</text><text x="1124" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">fetch + cache: no-store</text><line x1="1310" y1="372" x2="1310" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="395" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Валидация Zod</text><text x="1124" y="449" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">конверт + каждая запись</text><line x1="1310" y1="467" x2="1310" y2="490" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="490" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="519" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">FleetMapPage / Leaflet</text><text x="1124" y="544" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">маркеры · карточка · статус</text><rect x="1104" y="595" width="412" height="62" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5" opacity="1.0"/><text x="1124" y="620" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="start" opacity="1.0">Статус: live / stale / error</text><text x="1124" y="643" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#166534" text-anchor="start" opacity="1.0">последний хороший снимок не теряется</text><rect x="1080" y="770" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0" stroke-dasharray="8 6"/><text x="1100" y="802" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Тайлы OpenStreetMap</text><text x="1100" y="828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">демо: публичный OSM · прод: свой сервер</text><line x1="1210" y1="770" x2="1210" y2="730" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><line x1="390" y1="300" x2="470" y2="300" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arrow)"/><line x1="700" y1="300" x2="760" y2="300" stroke="#B45309" stroke-width="3" marker-end="url(#arrow)"/><line x1="1040" y1="300" x2="1080" y2="300" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="770" width="930" height="80" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0"/><text x="84" y="803" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">Без бэкенда · без БД · браузер не вызывает Magma</text><text x="84" y="830" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">Файл-снимок — единственная точка интеграции в MVP.</text>
</svg>
