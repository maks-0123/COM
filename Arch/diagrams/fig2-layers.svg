<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Figure 2. Frontend layers and the dependency rule</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">Outer layers know about inner layers. Domain knows nothing about React, Leaflet, fetch, or files.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="190" y="160" width="1080" height="130" rx="14" fill="#E2E8F0" stroke="#334155" stroke-width="2" opacity="1.0"/><text x="214" y="196" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">Presentation</text><rect x="214" y="218" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" opacity="0.95"/><text x="226" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">FleetMapPage</text><rect x="473" y="218" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" opacity="0.95"/><text x="485" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">FleetMap</text><rect x="732" y="218" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" opacity="0.95"/><text x="744" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">TruckDetails</text><rect x="991" y="218" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" opacity="0.95"/><text x="1003" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">StatusBanner</text><rect x="190" y="320" width="1080" height="150" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="214" y="356" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">Application</text><rect x="214" y="378" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/><text x="226" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">useFleetSnapshot</text><rect x="473" y="378" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/><text x="485" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">selectors</text><rect x="732" y="378" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/><text x="744" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">staleness rules</text><rect x="991" y="378" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2" opacity="0.95"/><text x="1003" y="408" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">diagnostics</text><rect x="190" y="500" width="1080" height="150" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="214" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">Domain</text><rect x="214" y="558" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" opacity="0.95"/><text x="226" y="588" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">FleetSnapshot</text><rect x="473" y="558" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" opacity="0.95"/><text x="485" y="588" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Truck / Station</text><rect x="732" y="558" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" opacity="0.95"/><text x="744" y="588" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Zod schemas</text><rect x="991" y="558" width="243" height="48" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" opacity="0.95"/><text x="1003" y="588" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">pure rules</text><rect x="190" y="680" width="1080" height="130" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" opacity="1.0"/><text x="214" y="716" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">Infrastructure</text><rect x="214" y="738" width="329" height="48" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" opacity="0.95"/><text x="226" y="768" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">JsonFileFleetRepository</text><rect x="559" y="738" width="329" height="48" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" opacity="0.95"/><text x="571" y="768" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">HTTP / WebSocket (future)</text><rect x="904" y="738" width="329" height="48" rx="9" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" opacity="0.95"/><text x="916" y="768" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="star