  <marker id="dot" markerWidth="10" markerHeight="10" refX="5" refY="5">
    <circle cx="5" cy="5" r="4" fill="#475569"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Figure 5. Target architecture: Magma and MQTT sit behind a server-side boundary</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">The browser still consumes only FleetSnapshot; it never holds Magma credentials or calls the core directly.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="60" y="180" width="300" height="150" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="84" y="218" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">Truck + on-board agent</text><text x="84" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">LTE modem</text><text x="84" y="279" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">RSRP / RSRQ / TA</text><text x="84" y="306" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">publishes measurements</text><rect x="60" y="390" width="300" height="150" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="84" y="428" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">Magma core</text><text x="84" y="462" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">AGW + Orchestrator</text><text x="84" y="489" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">SIM / session events</text><text x="84" y="516" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">attach, detach, handover</text><rect x="60" y="610" width="300" height="110" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" opacity="1.0"/><text x="84" y="648" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">MQTT broker</text><text x="84" y="680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">telemetry/&lt;truck-id&gt;</text><text x="84" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">QoS 1 · TLS</text><rect x="450" y="150" width="720" height="650" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" opacity="1.0"/><text x="474" y="188" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">Backend — private network</text><text x="474" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">No browser credentials, no direct core access</text><rect x="490" y="235" width="640" height="120" rx="14" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" opacity="1.0"/><text x="514" y="272" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#6D28D9" text-anchor="start" opacity="1.0">Ingest service</text><text x="514" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">normalizes events and measurements</text><text x="514" y="328" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">validates schema, deduplicates</text><rect x="490" y="395" width="640" height="100" rx="14" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="514" y="432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">Positioning engine</text><text x="514" y="464" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">RSSI → distances → multilateration → Kalman</text><rect x="490" y="535" width="640" height="100" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="514" y="572" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">Snapshot publisher</text><text x="514" y="604" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">one versioned FleetSnapshot per cycle</text><rect x="490" y="665" width="300" height="100" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2" opacity="1.0"/><text x="514" y="700" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">PostGIS / Timescale</text><text x="514" y="730" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">history + retention</text><rect x="830" y="665" width="300" height="100" rx="14" fill="#FFFFFF" stroke="#BE123C" stroke-width="2" opacity="1.0"/><text x="854" y="700" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#BE123C" text-anchor="start" opacity="1.0">REST + WebSocket</text><text x="854" y="730" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">auth, rate limits</text><rect x="1240" y="260" width="300" height="340" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" opacity="1.0"/><text x="1264" y="298" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Browser: React SPA</text><rect x="1264" y="320" width="252" height="60" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="1.0"/><text x="1280" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">FleetRepository</text><text x="1280" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">HTTP / WebSocket adapter</text><rect x="1264" y="395" width="252" height="60" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="1.0"/><text x="1280" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">FleetMapPage</text><text x="1280" y="443" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">domain + status rules</text><rect x="1264" y="470" width="252" height="60" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" opacity="1.0"/><text x="1280" y="495" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Leaflet map</text><text x="1280" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">dots, details, accuracy</text><text x="1264" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">HTTPS / WSS · same contract</text><path d="M 360 465 L 405 465 L 405 270 L 490 270" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="372" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">events</text><path d="M 360 665 L 430 665 L 430 315 L 490 315" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="382" y="650" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">measurements</text><line x1="810" y1="355" x2="810" y2="395" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/><line x1="810" y1="495" x2="810" y2="535" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arrow)"/><path d="M 640 635 L 640 665" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowTeal)"/><path d="M 980 635 L 980 665" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowTeal)"/><path d="M 1130 715 L 1215 715 L 1215 450 L 1240 450" fill="none" stroke="#BE123C" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="820" width="1460" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0"/><text x="84" y="856" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">Open5GS can replace Magma behind the same event/measurement adapters. The browser does not change.</text>
</svg>
