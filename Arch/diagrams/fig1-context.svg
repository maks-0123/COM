<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#1D4ED8"/>
  </marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#B45309"/>
  </marker>
  <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#0F766E"/>
  </marker>
  <marker id="dot" markerWidth="10" markerHeight="10" refX="5" refY="5">
    <circle cx="5" cy="5" r="4" fill="#475569"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Figure 1. MVP context: one file, one screen, no backend</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">The browser polls an atomic JSON snapshot; the positioning engine and Magma stay outside this increment.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="60" y="140" width="330" height="270" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="84" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">Coordinate producer</text><text x="84" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Positioning engine / script</text><text x="84" y="251" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">RSSI → distances → position</text><text x="84" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Writes one JSON snapshot</text><text x="84" y="313" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">1 Hz in the demo</text><text x="84" y="382" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="0.9">Outside this MVP</text><path d="M 470 225 h 190 l 40 40 v 145 h -230 z" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><path d="M 660 225 v 40 h 40" fill="none" stroke="#B45309" stroke-width="2"/><text x="488" y="268" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">fleet.snapshot.json</text><text x="492" y="306" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">schemaVersion: 1.0</text><text x="492" y="333" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">site + stations</text><text x="492" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">+ trucks</text><text x="492" y="387" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">tmp → rename</text><rect x="760" y="140" width="280" height="270" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="784" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">Static server</text><text x="784" y="220" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Nginx (prod) / Vite (dev)</text><text x="784" y="249" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">GET / → React build</text><text x="784" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">GET /data/…json</text><text x="784" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Cache-Control: no-store</text><text x="784" y="336" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Same origin → no CORS</text><rect x="1080" y="140" width="460" height="590" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" opacity="1.0"/><text x="1104" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Browser: React SPA</text><rect x="1104" y="205" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="234" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">useFleetSnapshot()</text><text x="1124" y="259" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">TanStack Query · 1 s polling</text><line x1="1310" y1="277" x2="1310" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="300" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="329" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">JsonFileFleetRepository</text><text x="1124" y="354" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">fetch + cache: no-store</text><line x1="1310" y1="372" x2="1310" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="395" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="424" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Zod validation</text><text x="1124" y="449" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">envelope + each record</text><line x1="1310" y1="467" x2="1310" y2="490" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1104" y="490" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" opacity="1.0"/><text x="1124" y="519" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">FleetMapPage / Leaflet</text><text x="1124" y="544" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">markers · details · status</text><rect x="1104" y="595" width="412" height="62" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5" opacity="1.0"/><text x="1124" y="620" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#166534" text-anchor="start" opacity="1.0">Status: live / stale / error</text><text x="1124" y="643" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#166534" text-anchor="start" opacity="1.0">last good snapshot is never discarded</text><rect x="1080" y="770" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0" stroke-dasharray="8 6"/><text x="1100" y="802" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">OpenStreetMap tiles</text><text x="1100" y="828" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">dev: public OSM · prod: self-hosted</text><line x1="1210" y1="770" x2="1210" y2="730" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><line x1="390" y1="300" x2="470" y2="300" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arrow)"/><line x1="675" y1="300" x2="760" y2="300" stroke="#B45309" stroke-width="3" marker-end="url(#arrow)"/><line x1="1040" y1="300" x2="1080" y2="300" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="770" width="930" height="80" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0"/><text x="84" y="803" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">No backend · no database · no Magma calls from the browser</text><text x="84" y="830" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">The snapshot file is the only integration point in MVP.</text>
</svg>
