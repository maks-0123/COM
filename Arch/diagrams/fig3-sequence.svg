<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
  </marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#1D4ED8"/>
  </marker>
  <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#B45309"/>
  </marker>
  <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6"
          orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#0F766E"/>
  </marker>
  <marker id="dot" markerWidth="10" markerHeight="10" refX="5" refY="5">
    <circle cx="5" cy="5" r="4" fill="#475569"/>
  </marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Figure 3. One polling cycle, including validation and failure behaviour</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">The UI never parses raw JSON directly; the repository returns a validated snapshot plus diagnostics.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="110" y="145" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="220" y="179" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1D4ED8" text-anchor="middle" opacity="1.0">Producer</text><line x1="220" y1="199" x2="220" y2="780" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><rect x="450" y="145" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="560" y="179" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#0F766E" text-anchor="middle" opacity="1.0">Static server</text><line x1="560" y1="199" x2="560" y2="780" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><rect x="790" y="145" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2" opacity="1.0"/><text x="900" y="179" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#334155" text-anchor="middle" opacity="1.0">Browser / React</text><line x1="900" y1="199" x2="900" y2="780" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><rect x="1070" y="145" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" opacity="1.0"/><text x="1180" y="179" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#6D28D9" text-anchor="middle" opacity="1.0">Zod</text><line x1="1180" y1="199" x2="1180" y2="780" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><rect x="1340" y="145" width="220" height="54" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2" opacity="1.0"/><text x="1450" y="179" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#B45309" text-anchor="middle" opacity="1.0">Leaflet map</text><line x1="1450" y1="199" x2="1450" y2="780" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/><rect x="345" y="250" width="1025" height="330" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" opacity="1.0" stroke-dasharray="8 6"/><text x="355" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#475569" text-anchor="start" opacity="1.0">every 1 s</text><line x1="220" y1="285" x2="560" y2="285" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="240" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1D4ED8" text-anchor="start" opacity="1.0">1. atomic write (tmp → rename)</text><line x1="560" y1="345" x2="900" y2="345" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="580" y="330" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#0F766E" text-anchor="start" opacity="1.0">2. GET /data/fleet.snapshot.json?t=…</text><line x1="900" y1="405" x2="1180" y2="405" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/><text x="918" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6D28D9" text-anchor="start" opacity="1.0">3. JSON.parse + envelope</text><line x1="1180" y1="465" x2="900" y2="465" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/><text x="918" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6D28D9" text-anchor="start" opacity="1.0">4. snapshot + diagnostics</text><line x1="900" y1="525" x2="1450" y2="525" stroke="#B45309" stroke-width="3" marker-end="url(#arrowAmber)"/><text x="918" y="510" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#B45309" text-anchor="start" opacity="1.0">5. render / move markers</text><line x1="900" y1="600" x2="900" y2="650" stroke="#BE123C" stroke-width="3" marker-end="url(#arrow)"/><text x="918" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#BE123C" text-anchor="start" opacity="1.0">6. on error: keep last good snapshot, show banner</text><rect x="380" y="690" width="850" height="66" rx="12" fill="#FFF1F2" stroke="#BE123C" stroke-width="1.5" opacity="1.0"/><text x="400" y="718" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#BE123C" text-anchor="start" opacity="1.0">Fail soft: a bad file never blanks the map.</text><text x="400" y="742" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">Invalid single records are skipped and counted; an invalid envelope is a fatal, explicit error.</text><text x="60" y="850" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">Cache-Control: no-store prevents a proxy or browser from serving yesterday&#x27;s positions as if they were current.</text>
</svg>
