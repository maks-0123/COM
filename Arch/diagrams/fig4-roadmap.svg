t-size="18" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">4–6 weeks</text><line x1="824" y1="306" x2="1116" y2="306" stroke="#B45309" stroke-width="1.5" opacity="0.5"/><circle cx="834" cy="346" r="4" fill="#B45309"/><text x="850" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Truck agent → MQTT</text><circle cx="834" cy="398" r="4" fill="#B45309"/><text x="850" y="405" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Magma AGW events</text><circle cx="834" cy="450" r="4" fill="#B45309"/><text x="850" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Positioning engine</text><circle cx="834" cy="502" r="4" fill="#B45309"/><text x="850" y="509" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">WebSocket stream</text><circle cx="834" cy="554" r="4" fill="#B45309"/><text x="850" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Server-side credentials</text><rect x="820" y="640" width="300" height="92" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2" opacity="0.9"/><text x="834" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="start" opacity="1.0">What changes</text><text x="834" y="698" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#B45309" text-anchor="start" opacity="1.0">Backend + radio</text><text x="834" y="720" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">What stays: UI + contract</text><rect x="1170" y="170" width="340" height="590" rx="16" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" opacity="1.0"/><text x="1194" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#6D28D9" text-anchor="start" opacity="1.0">PHASE 3</text><text x="1194" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Production</text><text x="1194" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#6D28D9" text-anchor="start" opacity="1.0">ongoing</text><line x1="1194" y1="306" x2="1486" y2="306" stroke="#6D28D9" stroke-width="1.5" opacity="0.5"/><circle cx="1204" cy="346" r="4" fill="#6D28D9"/><text x="1220" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">PostGIS / Timescale history</text><circle cx="1204" cy="398" r="4" fill="#6D28D9"/><text x="1220" y="405" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">SSO + roles</text><circle cx="1204" cy="450" r="4" fill="#6D28D9"/><text x="1220" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Geofences + alerts</text><circle cx="1204" cy="502" r="4" fill="#6D28D9"/><text x="1220" y="509" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">HA + monitoring</text><circle cx="1204" cy="554" r="4" fill="#6D28D9"/><text x="1220" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Site calibration</text><rect x="1190" y="640" width="300" height="92" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.2" opacity="0.9"/><text x="1204" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="start" opacity="1.0">What changes</text><text x="1204" y="698" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#6D28D9" text-anchor="start" opacity="1.0">Operations</text><text x="1204" y="720" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">What stays: UI + contract</text><line x1="400" y1="465" x2="430" y2="465" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="770" y1="465" x2="800" y2="465" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="1140" y1="465" x2="1170" y2="465" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="800" width="1450" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" opacity="1.0"/><text x="84" y="836" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#334155" text-anchor="start" opacity="1.0">Flexibility test: replace the file with an API without touching FleetMapPage, the domain types, or the markers.</text>
