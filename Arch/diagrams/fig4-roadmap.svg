<text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Figure 4. Evolution without a rewrite: file → API → Magma → production</text><text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">The UI and the snapshot contract stay stable; only the source adapter and the server side grow.</text><line x1="60" y1="118" x2="1540" y2="118" stroke="#CBD5E1" stroke-width="2"/><rect x="60" y="170" width="340" height="590" rx="16" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2" opacity="1.0"/><text x="84" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">PHASE 0 · NOW</text><text x="84" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">File MVP</text><text x="84" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">1–2 weeks</text><line x1="84" y1="306" x2="376" y2="306" stroke="#1D4ED8" stroke-width="1.5" opacity="0.5"/><circle cx="94" cy="346" r="4" fill="#1D4ED8"/><text x="110" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">JSON snapshot → React</text><circle cx="94" cy="398" r="4" fill="#1D4ED8"/><text x="110" y="405" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Leaflet map + dots</text><circle cx="94" cy="450" r="4" fill="#1D4ED8"/><text x="110" y="457" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">1 s polling, no backend</text><circle cx="94" cy="502" r="4" fill="#1D4ED8"/><text x="110" y="509" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">One versioned contract</text><circle cx="94" cy="554" r="4" fill="#1D4ED8"/><text x="110" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Demo + architecture seam</text><rect x="80" y="640" width="300" height="92" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2" opacity="0.9"/><text x="94" y="670" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#475569" text-anchor="start" opacity="1.0">What changes</text><text x="94" y="698" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1D4ED8" text-anchor="start" opacity="1.0">No UI rework</text><text x="94" y="720" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="start" opacity="1.0">What stays: UI + contract</text><rect x="430" y="170" width="340" height="590" rx="16" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="1.0"/><text x="454" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">PHASE 1</text><text x="454" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#0F172A" text-anchor="start" opacity="1.0">Snapshot API</text><text x="454" y="286" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0F766E" text-anchor="start" opacity="1.0">1–2 weeks</text><line x1="454" y1="306" x2="746" y2="306" stroke="#0F766E" stroke-width="1.5" opacity="0.5"/><circle cx="464" cy="346" r="4" fill="#0F766E"/><text x="480" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#0F172A" text-anchor="start" opacity="1.0">Backend serves the same JSON</text><circle cx="464" cy="398" r="4" fill="#0F766E"/><t